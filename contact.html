<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Grace Dugan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Avenir', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #3a3a3a;
            background-color: #e8e4dd;
        }
        
        header {
            background: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .orange-dot {
            width: 30px;
            height: 30px;
            background: #d4884f;
            border-radius: 50%;
        }
        
        .logo-text h1 {
            font-size: 1.1em;
            font-weight: 600;
            color: #3a3a3a;
            margin: 0;
        }
        
        .logo-text p {
            font-size: 0.85em;
            color: #666;
            margin: 0;
        }
        
        nav {
            display: flex;
            gap: 30px;
        }
        
        nav a {
            text-decoration: none;
            color: #3a3a3a;
            font-size: 0.95em;
            transition: color 0.3s;
        }
        
        nav a:hover,
        nav a.active {
            color: #d4884f;
        }
        
        .contact-container {
            max-width: 1100px;
            margin: 80px auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 80px;
            align-items: start;
        }
        
        .contact-left h1 {
            font-size: 3em;
            font-weight: 600;
            color: #3a3a3a;
            margin-bottom: 50px;
        }
        
        .contact-info h3 {
            font-size: 1.1em;
            font-weight: 600;
            color: #3a3a3a;
            margin-bottom: 10px;
        }
        
        .contact-info p {
            color: #555;
            margin-bottom: 30px;
        }
        
        .contact-info a {
            color: #555;
            text-decoration: none;
        }
        
        .contact-info a:hover {
            color: #d4884f;
        }
        
        .contact-form {
            display: grid;
            gap: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 8px;
            color: #3a3a3a;
            font-size: 0.95em;
        }
        
        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 1px solid #999;
            background: white;
            font-family: inherit;
            font-size: 1em;
            color: #3a3a3a;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #d4884f;
        }
        
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .submit-btn {
            padding: 15px 40px;
            background: white;
            border: 2px solid #d4884f;
            color: #d4884f;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            justify-self: start;
        }
        
        .submit-btn:hover {
            background: #d4884f;
            color: white;
        }
        
        @media (max-width: 968px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            
            .contact-container {
                grid-template-columns: 1fr;
                gap: 50px;
                padding: 0 20px;
                margin: 50px auto;
            }
            
            .contact-left h1 {
                font-size: 2em;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="orange-dot"></div>
            <div class="logo-text">
                <h1>Grace Dugan</h1>
                <p>Writer & Editor</p>
            </div>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="resume.html">Resume</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <div class="contact-container">
        <div class="contact-left">
            <h1>Contact Me</h1>
            
            <div class="contact-info">
                <h3>Phone</h3>
                <p>(978) 501-6404</p>
                
                <h3>Email</h3>
                <p><a href="mailto:gracedugan@gmail.com">gracedugan@gmail.com</a></p>
            </div>
        </div>
        
        <div class="contact-right">
            <!-- NOTE: This form won't actually work without a backend. 
                 Options to make it work:
                 1. Use a service like Formspree.io (add action="https://formspree.io/f/YOUR_ID")
                 2. Use Netlify Forms (add netlify attribute to form tag)
                 3. Set up your own backend
            -->
            <form class="contact-form" action="#" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
